quarkus.application.name=events-api
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.acquisition-timeout=20S
quarkus.datasource.jdbc.idle-removal-interval=30S
quarkus.datasource.jdbc.max-lifetime=25M
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.jdbc.timezone=America/Bogota
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."com.events".level=DEBUG
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:4200,https://frontend-pi-olive-30.vercel.app}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=events-api
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
mp.jwt.verify.issuer=events-api
mp.jwt.verify.clock.skew=60
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.verify.secretkey=${JWT_SECRET}
smallrye.jwt.required.claims=sub,iat,exp
quarkus.http.auth.permission.public.paths=/api/auth/register,/api/auth/login,/api-docs,/swagger-ui*,/q/health*,/actuator/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.policy.admin.roles-allowed=ADMIN
quarkus.http.auth.permission.admin.paths=/api/admin/*
quarkus.http.auth.permission.admin.policy=admin
quarkus.http.auth.policy.organizador.roles-allowed=ORGANIZADOR
quarkus.http.auth.permission.organizador.paths=/api/events*,/api/subtasks*,/api/capacity*,/api/today*
quarkus.http.auth.permission.organizador.policy=organizador
quarkus.smallrye-openapi.path=/api-docs
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.package.jar.type=fast-jar
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:events;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
%test.app.security.jwt.secret=test-secret-test-secret-test-secret-123
%test.smallrye.jwt.verify.secretkey=test-secret-test-secret-test-secret-123
quarkus.http.test-port=0
