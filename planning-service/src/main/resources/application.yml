# planning-service: eventos, subtareas, capacidad diaria y vista de hoy.
# No valida JWT: la identidad llega en X-User-Id / X-Organizador-Id / X-Roles desde el gateway.
quarkus:
  application:
    name: "planning-service"
  http:
    port: "${PORT:8080}"
    host: "0.0.0.0"
    proxy:
      proxy-address-forwarding: true
      allow-x-forwarded: true
      enable-forwarded-host: true
      enable-forwarded-prefix: true
    # CORS lo resuelve Traefik una sola vez para todos los servicios; activarlo aqui duplicaria headers.
    cors:
      enabled: false
    auth:
      permission:
        # /internal/* no lo enruta Traefik: solo es alcanzable desde la red privada de Docker.
        public:
          paths: "/planning/*,/q/health*,/actuator/*,/internal/*"
          policy: "permit"
        api:
          paths: "/api/*"
          policy: "authenticated"
        organizador:
          paths: "/api/events*,/api/subtasks*,/api/capacity*,/api/today*"
          policy: "organizador"
      policy:
        organizador:
          roles-allowed: "ORGANIZADOR"
    test-port: 0
  datasource:
    db-kind: "postgresql"
    jdbc:
      url: "${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}"
      max-size: 5
      min-size: 1
      acquisition-timeout: "20S"
      idle-removal-interval: "30S"
      max-lifetime: "25M"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    devservices:
      enabled: false
  hibernate-orm:
    schema-management:
      strategy: "validate"
    sql-load-script: "no-file"
    jdbc:
      timezone: "America/Bogota"
  smallrye-openapi:
    path: "/planning/api-docs"
  swagger-ui:
    always-include: true
    path: "/planning/swagger-ui"
  package:
    jar:
      type: "fast-jar"
"%dev":
  quarkus:
    hibernate-orm:
      log:
        sql: true
    log:
      category:
        "com.events":
          level: "DEBUG"
"%test":
  quarkus:
    datasource:
      db-kind: "h2"
      jdbc:
        url: "jdbc:h2:mem:planning;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    hibernate-orm:
      schema-management:
        strategy: "drop-and-create"
      sql-load-script: "no-file"
