# identity-service: cuentas, roles, emision de JWT y verificacion para el gateway (forwardAuth).
quarkus:
  application:
    name: "identity-service"
  http:
    port: "${PORT:8080}"
    host: "0.0.0.0"
    # Traefik termina TLS: confiar en X-Forwarded-* para conocer el scheme/host reales
    proxy:
      proxy-address-forwarding: true
      allow-x-forwarded: true
      enable-forwarded-host: true
      enable-forwarded-prefix: true
    # CORS lo resuelve Traefik una sola vez para todos los servicios; activarlo aqui duplicaria headers.
    cors:
      enabled: false
    auth:
      permission:
        public:
          paths: "/api/auth/register,/api/auth/login,/identity/*,/q/health*,/actuator/*"
          policy: "permit"
        api:
          paths: "/api/*"
          policy: "authenticated"
        admin:
          paths: "/api/admin/*"
          policy: "admin"
      policy:
        admin:
          roles-allowed: "ADMIN"
    test-port: 0
  datasource:
    db-kind: "postgresql"
    jdbc:
      url: "${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}"
      max-size: 5
      min-size: 1
      acquisition-timeout: "20S"
      idle-removal-interval: "30S"
      max-lifetime: "25M"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    devservices:
      enabled: false
  hibernate-orm:
    schema-management:
      strategy: "validate"
    sql-load-script: "no-file"
    jdbc:
      timezone: "America/Bogota"
  rest-client:
    planning:
      url: "${PLANNING_URL:http://planning-service:8080}"
      connect-timeout: 2000
      read-timeout: 5000
  # Rutas con prefijo propio para que el gateway publique la documentacion de cada servicio.
  smallrye-openapi:
    path: "/identity/api-docs"
    security-scheme: "jwt"
    security-scheme-name: "bearerAuth"
  swagger-ui:
    always-include: true
    path: "/identity/swagger-ui"
  package:
    jar:
      type: "fast-jar"
"%dev":
  quarkus:
    hibernate-orm:
      log:
        sql: true
    log:
      category:
        "com.events":
          level: "DEBUG"
app:
  security:
    jwt:
      secret: '${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}'
      issuer: "events-api"
      expiration-minutes: "${JWT_EXPIRATION_MINUTES:120}"
mp:
  jwt:
    verify:
      issuer: "events-api"
      clock:
        skew: 60
smallrye:
  jwt:
    verify:
      algorithm: "HS256"
      secretkey: '${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}'
    required:
      claims: "sub,iat,exp"
"%test":
  quarkus:
    datasource:
      db-kind: "h2"
      jdbc:
        url: "jdbc:h2:mem:identity;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    hibernate-orm:
      schema-management:
        strategy: "drop-and-create"
      sql-load-script: "import-test.sql"
    rest-client:
      planning:
        url: "http://localhost:1"
  app:
    security:
      jwt:
        secret: "test-secret-test-secret-test-secret-123"
  smallrye:
    jwt:
      verify:
        secretkey: "test-secret-test-secret-test-secret-123"
